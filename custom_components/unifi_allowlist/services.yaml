allow:
  name: Allow device
  description: Add a MAC to the allow list and unblock it on the controller.
  fields:
    mac:
      name: MAC address
      required: true
      example: "a4:83:e7:12:34:56"
      selector:
        text:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

deny:
  name: Deny device
  description: Add a MAC to the deny list and block it on the controller.
  fields:
    mac:
      name: MAC address
      required: true
      example: "a4:83:e7:12:34:56"
      selector:
        text:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

forget:
  name: Forget device
  description: Remove a MAC from every list. It will be treated as new next time it appears.
  fields:
    mac:
      name: MAC address
      required: true
      selector:
        text:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

forget_offline_pending:
  name: Forget offline waiting devices
  description: >-
    Clear every device in the waiting queue that is not connected right now.
    Useful when phones using randomised MAC addresses leave behind a trail of
    dead entries. Devices still on the wifi are left alone.
  fields:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

resend_pending:
  name: Resend pending
  description: Send a fresh notification for every device still waiting on an answer.
  fields:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

unblock_all:
  name: Unblock everything
  description: >-
    Clear every block on the controller. The deny list is left alone, so
    deliberately denied devices are re-blocked on the next poll.
  fields:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

prune:
  name: Prune stale devices
  description: >-
    Forget offline wireless clients on the controller and drop them from the
    allow list. Wired devices are skipped unless wired devices are being
    watched; denied and pending devices are always skipped.
  fields:
    days:
      name: Not seen for (days)
      default: 7
      selector:
        number:
          min: 0
          max: 365
          mode: box
    dry_run:
      name: Preview only
      default: true
      selector:
        boolean:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

import_list:
  name: Import MAC list from file
  description: >-
    Read MAC addresses from a file and add them to a list. Accepts a JSON array,
    a JSON object keyed by MAC, or plain text with one MAC per line.
  fields:
    path:
      name: File path
      required: true
      example: /config/known_macs.json
      selector:
        text:
    target:
      name: Add to
      default: allowed
      selector:
        select:
          options:
            - allowed
            - denied
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

export_list:
  name: Export MAC list to file
  description: Write a list out as a JSON array, for backup or seeding another site.
  fields:
    path:
      name: File path
      required: true
      example: /config/allow_list_backup.json
      selector:
        text:
    target:
      name: Export
      default: allowed
      selector:
        select:
          options:
            - allowed
            - denied
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

set_name:
  name: Name a device
  description: >-
    Give a device your own name. It overrides whatever the controller reports
    and follows the MAC between the allow and deny lists. Leave the name empty
    to clear it.
  fields:
    mac:
      name: MAC address
      required: true
      example: "a4:83:e7:12:34:56"
      selector:
        text:
    name:
      name: Name
      example: "Kitchen tablet"
      selector:
        text:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

allow_online_unknown:
  name: Allow everything on wifi now
  description: >-
    Approve every unknown device currently connected. Intended for setting up a
    new site: turn enforcement off, let the list fill with the devices you
    already trust, run this once, then turn enforcement back on. Devices that
    are not watched - outside the chosen wifi networks, or never blocked, such as this
    Home Assistant host - are left alone.
  fields:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

sync_from_unifi:
  name: Sync with UniFi
  description: >-
    Reconcile this integration against what the controller is actually
    enforcing. Devices blocked in the UniFi UI that this integration did not
    block are moved to Denied. Devices denied here that are no longer blocked
    on the controller are blocked again. Nothing is ever unblocked. Leave dry
    run on first to see the counts in the log without changing anything.
  fields:
    dry_run:
      name: Dry run
      description: Report what would change without changing it.
      required: false
      default: true
      selector:
        boolean:
    reblock:
      name: Re-block drifted denials
      description: >-
        Also re-apply blocks for devices denied here that are no longer blocked
        on the controller.
      required: false
      default: true
      selector:
        boolean:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

unblock_untracked:
  name: Unblock stranded devices
  description: >-
    Unblock every device the controller is blocking that this integration has
    no record of. Use this to clean up blocks left behind by Forget. Devices in
    the denied or waiting lists are left blocked.
  fields:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

accept_list_size:
  name: Accept the current allow list size
  description: >-
    Clears the "data looks to have been lost" guard by taking the current allow
    list as correct. Only use this when you know the smaller list is right, for
    example after editing storage by hand. Restoring a backup is the usual fix.
  fields:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

apply_review:
  name: Apply a device review
  description: >-
    Trust some devices and hold the rest for a decision, in one go. While the
    site is still learning (first run), this also finishes setup and starts
    protecting. Held devices are blocked when "Block on sight" is on, and
    queued in Waiting either way.
  fields:
    trust:
      name: Trust
      description: MAC addresses to add to the allow list.
      required: false
      example: '["a4:83:e7:12:34:56"]'
      selector:
        text:
          multiple: true
    block:
      name: Hold for review
      description: MAC addresses to block and queue in Waiting.
      required: false
      example: '["de:ad:be:ef:00:01"]'
      selector:
        text:
          multiple: true
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

forget_blocked:
  name: Forget all blocked devices
  description: >-
    Clean up the Blocked list: forget every device on it, here and on the
    controller. Each block is lifted in UniFi too (the device is forgotten
    there when "Forget also removes the device from UniFi" is on, otherwise
    unblocked), so the sync does not pull it back. Clients with an alias or a
    fixed IP in UniFi are only unblocked, never wiped. A forgotten device that
    comes back is treated as new. Run with dry run first.
  fields:
    dry_run:
      name: Dry run
      description: Only count what would be forgotten, and send that as a notification.
      default: true
      selector:
        boolean:
    include_connected:
      name: Include devices connected now
      description: >-
        Off leaves blocked devices that are online right now alone. Turning it
        on unblocks them, and they come back as new devices on the next check.
      default: false
      selector:
        boolean:
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist

bulk_action:
  name: Allow, block or forget several devices
  description: >-
    What the panel's multi-select uses: apply one action to a list of MAC
    addresses in a single call. Forget also lifts the block in UniFi, so the
    sync does not pull the device back into Blocked.
  fields:
    action:
      name: Action
      required: true
      selector:
        select:
          options:
            - allow
            - deny
            - forget
    macs:
      name: MAC addresses
      required: true
      example: '["a4:83:e7:12:34:56", "de:ad:be:ef:00:01"]'
      selector:
        text:
          multiple: true
    site:
      name: Site
      description: >-
        Which UniFi site to act on. Only needed when more than one site is set
        up; with a single site it is used automatically.
      required: false
      selector:
        config_entry:
          integration: unifi_allowlist
