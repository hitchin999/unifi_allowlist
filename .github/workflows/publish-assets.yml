name: Attach UniFi Allow List ZIP on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-asset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package UniFi Allow List
        # move into the folder that *contains* your integration files:
        run: |
          cd custom_components/unifi_allowlist
          # zip up everything *in* this folder into a ZIP whose root is those files:
          zip -r __artifact__.zip .
          # move it back to workspace root and register:
          mv __artifact__.zip $GITHUB_WORKSPACE/unifi_allowlist.zip
          echo "ASSET=unifi_allowlist.zip" >> $GITHUB_ENV

      - name: Upload ZIP Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
